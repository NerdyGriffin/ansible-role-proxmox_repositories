---
# Internal repository definitions for nerdygriffin.proxmox_repositories.
# These map the documented Proxmox VE 9 deb822 sources to the public toggle
# vars in defaults/main.yml. Not intended to be overridden by consumers — set
# the *_enabled toggles and *_release vars instead.
# Source of truth: https://pve.proxmox.com/pve-docs/chapter-sysadmin.html

proxmox_repositories__pve:
  - name: pve-enterprise
    uris: https://enterprise.proxmox.com/debian/pve
    components: pve-enterprise
    enabled: "{{ proxmox_repositories_pve_enterprise_enabled }}"
  - name: proxmox
    uris: http://download.proxmox.com/debian/pve
    components: pve-no-subscription
    enabled: "{{ proxmox_repositories_pve_no_subscription_enabled }}"
  - name: pve-test
    uris: http://download.proxmox.com/debian/pve
    components: pve-test
    enabled: "{{ proxmox_repositories_pve_test_enabled }}"

# The role owns ceph.sources (the installer ships it as the enterprise channel);
# managing name "ceph" converges it to the no-subscription stanza so an unused,
# unsubscribed Ceph repo cannot 401 `apt update`.
proxmox_repositories__ceph:
  - name: ceph
    uris: "http://download.proxmox.com/debian/ceph-{{ proxmox_repositories_ceph_release }}"
    components: no-subscription
    enabled: "{{ proxmox_repositories_ceph_no_subscription_enabled }}"
  - name: ceph-enterprise
    uris: "https://enterprise.proxmox.com/debian/ceph-{{ proxmox_repositories_ceph_release }}"
    components: enterprise
    enabled: "{{ proxmox_repositories_ceph_enterprise_enabled }}"
  - name: ceph-test
    uris: "http://download.proxmox.com/debian/ceph-{{ proxmox_repositories_ceph_release }}"
    components: test
    enabled: "{{ proxmox_repositories_ceph_test_enabled }}"
